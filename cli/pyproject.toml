[project]
name = "crosswalk-cli"
version = "0.1.0"
description = "Links a folder of datasets to a Crosswalk project and sends their column profiles."
requires-python = ">=3.12"
dependencies = [
    "fastexcel>=0.12",
    "httpx>=0.27",
    "keyring>=25",
    "pandas>=2.2",
    "polars>=1.20",
    "pyarrow>=17",
    "pyreadstat>=1.2.8",
    "rich>=13.7",
    "typer>=0.15",
]

[project.scripts]
crosswalk = "crosswalk_cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "xlsxwriter>=3.2",
    "xlwt>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosswalk_cli"]

# The package is installed as a built copy, not as a link to src/. On macOS a
# link relies on a .pth file inside .venv, which the system marks as hidden,
# and Python 3.13 ignores hidden .pth files. The cache keys make uv rebuild the
# copy whenever the source changes.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
