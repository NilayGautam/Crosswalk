name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm build
      - run: uv --directory cli sync --no-editable
      - run: pnpm --filter @crosswalk/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  cli:
    name: Command line tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv --directory cli sync --no-editable
      - run: uv --directory cli run --no-editable ruff check .
      - run: uv --directory cli run --no-editable ruff format --check .
      - run: uv --directory cli run --no-editable pytest -q
